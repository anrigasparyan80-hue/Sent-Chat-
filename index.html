<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sent Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #3ecf8e; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .header select { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px; border-radius: 6px; cursor: pointer; }
    .screen { display: none; flex: 1; padding: 15px; overflow-y: auto; }
    .screen.active { display: block; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; text-align: left; }
    
    /* Контейнер для телефона с выбором кода */
    .phone-row { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
    .phone-row select { width: 110px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; cursor: pointer; }
    .phone-row input { flex: 1; margin: 0; }

    button { width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
    button.secondary { background: #666; }
    
    /* Стили для аватарки */
    .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto 10px auto; cursor: pointer; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #3ecf8e; background: #eee; }
    .avatar-edit-overlay { position: absolute; bottom: 0; right: 0; background: #3ecf8e; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid white; }
    
    .nav-bar { display: none; background: white; border-top: 1px solid #eee; }
    .nav-bar.active { display: flex; }
    .nav-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #666; font-size: 14px; }
    .nav-btn.active { color: #3ecf8e; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <span id="appTitle">Sent Chat</span>
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="ru">RU</option>
      <option value="en">EN</option>
    </select>
  </div>

  <!-- ВХОД -->
  <div id="authScreen" class="screen active">
    <div class="card">
      <h3 data-i18n="authTitle">Вход в чат 🔑</h3>
      <input type="text" id="loginInput" placeholder="Введите ваш никнейм">
      
      <!-- Поле выбора кода страны и ввода номера -->
      <div class="phone-row">
        <select id="countryCode">
          <option value="+995">🇬🇪 +995</option>
          <option value="+7">🇷🇺/🇰🇿 +7</option>
          <option value="+380">🇺🇦 +380</option>
          <option value="+375">🇧🇾 +375</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+49">🇩🇪 +49</option>
        </select>
        <input type="tel" id="phoneInput" placeholder="Номер телефона">
      </div>

      <button onclick="loginUser()" data-i18n="authBtn">Войти в приложение</button>
    </div>
  </div>

  <!-- ЧАТЫ -->
  <div id="chatsScreen" class="screen">
    <div class="card" style="text-align: left;">
      <h3 data-i18n="chatsHeader">Чаты 💬</h3>
      <input type="text" id="targetUser" placeholder="С кем хотите начать чат (ник)?">
      <button onclick="openChat()" data-i18n="openChatBtn">Открыть чат</button>
    </div>
    <div class="card" style="text-align: left;">
      <h3><span data-i18n="activeChatWith">Активный чат с</span>: <span id="chatWithTitle" style="color: #3ecf8e;" data-i18n="none">никто</span></h3>
      <div id="messagesList" style="height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 8px; margin-bottom: 8px; border-radius: 8px; background: #fafafa;" data-i18n="noMessages">Сообщений пока нет</div>
      <input type="text" id="messageInput" placeholder="Введите сообщение...">
      <button onclick="sendMessage()" data-i18n="sendBtn">Отправить</button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <h3 data-i18n="profileHeader">Профиль 👤</h3>
      
      <!-- Кликабельная аватарка -->
      <div class="avatar-container" onclick="document.getElementById('avatarFile').click()">
        <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
        <div class="avatar-edit-overlay">📷</div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display: none;" onchange="changeAvatar(event)">

      <p style="margin-top: 15px;"><span data-i18n="yourNick">Ваш ник</span>: <b id="welcomeUser">@...</b></p>
      <p><span data-i18n="yourPhone">Телефон</span>: <b id="welcomePhone">+...</b></p>
      <button onclick="logout()" class="secondary" data-i18n="logoutBtn">Выйти из аккаунта</button>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <div class="nav-bar" id="mainNav">
    <button class="nav-btn active" onclick="showScreen('chatsScreen', this)" data-i18n="navChats">Чаты</button>
    <button class="nav-btn" onclick="showScreen('profileScreen', this)" data-i18n="navProfile">Профиль</button>
  </div>

  <script>
    const translations = {
      ru: {
        authTitle: "Вход в чат 🔑",
        authPlaceholder: "Введите ваш никнейм",
        phonePlaceholder: "Номер телефона",
        authBtn: "Войти в приложение",
        chatsHeader: "Чаты 💬",
        targetPlaceholder: "С кем хотите начать чат (ник)?",
        openChatBtn: "Открыть чат",
        activeChatWith: "Активный чат с",
        none: "никто",
        noMessages: "Сообщений пока нет",
        msgPlaceholder: "Введите сообщение...",
        sendBtn: "Отправить",
        profileHeader: "Профиль 👤",
        yourNick: "Ваш ник",
        yourPhone: "Телефон",
        logoutBtn: "Выйти из аккаунта",
        navChats: "Чаты",
        navProfile: "Профиль",
        chatOpened: "Чат открыт. Напишите первое сообщение!",
        alertNoName: "Введите никнейм!",
        alertNoPhone: "Введите номер телефона!",
        alertSelf: "Нельзя писать самому себе!",
        alertNoTarget: "Введите ник собеседника!",
        alertNoSelect: "Сначала выберите собеседника сверху!"
      },
      en: {
        authTitle: "Chat Login 🔑",
        authPlaceholder: "Enter your nickname",
        phonePlaceholder: "Phone number",
        authBtn: "Sign In",
        chatsHeader: "Chats 💬",
        targetPlaceholder: "Who do you want to chat with?",
        openChatBtn: "Open Chat",
        activeChatWith: "Active chat with",
        none: "none",
        noMessages: "No messages yet",
        msgPlaceholder: "Type a message...",
        sendBtn: "Send",
        profileHeader: "Profile 👤",
        yourNick: "Your nickname",
        yourPhone: "Phone",
        logoutBtn: "Log out",
        navChats: "Chats",
        navProfile: "Profile",
        chatOpened: "Chat opened. Type your first message!",
        alertNoName: "Enter a nickname!",
        alertNoPhone: "Enter a phone number!",
        alertSelf: "You cannot message yourself!",
        alertNoTarget: "Enter recipient's nickname!",
        alertNoSelect: "Select a recipient first!"
      }
    };

    let currentLang = localStorage.getItem('chat_lang') || 'ru';
    document.getElementById('langSelect').value = currentLang;

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('chat_lang', lang);
      updateTexts();
    }

    function updateTexts() {
      const t = translations[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });
      document.getElementById('loginInput').placeholder = t.authPlaceholder;
      document.getElementById('phoneInput').placeholder = t.phonePlaceholder;
      document.getElementById('targetUser').placeholder = t.targetPlaceholder;
      document.getElementById('messageInput').placeholder = t.msgPlaceholder;
    }

    let currentUser = localStorage.getItem('chat_user') || '';
    let currentPhone = localStorage.getItem('chat_phone') || '';
    let activeChatUser = '';

    if (currentUser) {
      initApp(currentUser, currentPhone);
    }

    function loginUser() {
      const name = document.getElementById('loginInput').value.trim();
      const code = document.getElementById('countryCode').value;
      const rawPhone = document.getElementById('phoneInput').value.trim();
      const t = translations[currentLang];

      if (!name) {
        alert(t.alertNoName);
        return;
      }
      if (!rawPhone) {
        alert(t.alertNoPhone);
        return;
      }

      const fullPhone = code + ' ' + rawPhone;

      localStorage.setItem('chat_user', name);
      localStorage.setItem('chat_phone', fullPhone);
      initApp(name, fullPhone);
    }

    function initApp(name, phone) {
      currentUser = name;
      currentPhone = phone;
      document.getElementById('welcomeUser').innerText = '@' + name;
      document.getElementById('welcomePhone').innerText = phone;
      
      const savedAvatar = localStorage.getItem('chat_avatar_' + name);
      if (savedAvatar) {
        document.getElementById('userAvatar').src = savedAvatar;
      }

      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('mainNav').classList.add('active');
      showScreen('chatsScreen', document.querySelector('.nav-btn'));
      updateTexts();
    }

    function logout() {
      localStorage.removeItem('chat_user');
      localStorage.removeItem('chat_phone');
      location.reload();
    }

    function showScreen(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function changeAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        document.getElementById('userAvatar').src = base64Image;
        localStorage.setItem('chat_avatar_' + currentUser, base64Image);
      };
      reader.readAsDataURL(file);
    }

    function openChat() {
      const target = document.getElementById('targetUser').value.trim();
      const t = translations[currentLang];
      if (!target) {
        alert(t.alertNoTarget);
        return;
      }
      if (target === currentUser) {
        alert(t.alertSelf);
        return;
      }
      activeChatUser = target;
      document.getElementById('chatWithTitle').innerText = '@' + target;
      document.getElementById('messagesList').innerHTML = t.chatOpened;
    }

    function sendMessage() {
      const text = document.getElementById('messageInput').value.trim();
      const t = translations[currentLang];
      if (!activeChatUser) {
        alert(t.alertNoSelect);
        return;
      }
      if (!text) return;

      const messagesDiv = document.getElementById('messagesList');
      messagesDiv.innerHTML += `<div><b>@${currentUser}:</b> ${text}</div>`;
      document.getElementById('messageInput').value = '';
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    updateTexts();
  </script>
</body>
</html>
