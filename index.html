<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sent Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #3ecf8e; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    .screen { display: none; flex: 1; padding: 15px; overflow-y: auto; }
    .screen.active { display: block; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; text-align: left; }
    button { width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
    button.secondary { background: #666; }
    
    /* Стили для аватарки */
    .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto 10px auto; cursor: pointer; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #3ecf8e; background: #eee; }
    .avatar-edit-overlay { position: absolute; bottom: 0; right: 0; background: #3ecf8e; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid white; }
    
    .nav-bar { display: none; background: white; border-top: 1px solid #eee; }
    .nav-bar.active { display: flex; }
    .nav-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #666; font-size: 14px; }
    .nav-btn.active { color: #3ecf8e; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">Sent Chat</div>

  <!-- ВХОД -->
  <div id="authScreen" class="screen active">
    <div class="card">
      <h3>Вход в чат 🔑</h3>
      <input type="text" id="loginInput" placeholder="Введите ваш никнейм">
      <button onclick="loginUser()">Войти в приложение</button>
    </div>
  </div>

  <!-- ЧАТЫ -->
  <div id="chatsScreen" class="screen">
    <div class="card" style="text-align: left;">
      <h3>Чаты 💬</h3>
      <input type="text" id="targetUser" placeholder="С кем хотите начать чат (ник)?">
      <button onclick="openChat()">Открыть чат</button>
    </div>
    <div class="card" style="text-align: left;">
      <h3>Активный чат с: <span id="chatWithTitle" style="color: #3ecf8e;">никто</span></h3>
      <div id="messagesList" style="height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 8px; margin-bottom: 8px; border-radius: 8px; background: #fafafa;">Сообщений пока нет</div>
      <input type="text" id="messageInput" placeholder="Введите сообщение...">
      <button onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <h3>Профиль 👤</h3>
      
      <!-- Кликабельная аватарка -->
      <div class="avatar-container" onclick="document.getElementById('avatarFile').click()">
        <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
        <div class="avatar-edit-overlay">📷</div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display: none;" onchange="changeAvatar(event)">

      <p style="margin-top: 15px;">Ваш ник: <b id="welcomeUser">@...</b></p>
      <button onclick="logout()" class="secondary">Выйти из аккаунта</button>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <div class="nav-bar" id="mainNav">
    <button class="nav-btn active" onclick="showScreen('chatsScreen', this)">Чаты</button>
    <button class="nav-btn" onclick="showScreen('profileScreen', this)">Профиль</button>
  </div>

  <script>
    let currentUser = localStorage.getItem('chat_user') || '';
    let activeChatUser = '';

    if (currentUser) {
      initApp(currentUser);
    }

    function loginUser() {
      const name = document.getElementById('loginInput').value.trim();
      if (!name) {
        alert('Введите никнейм!');
        return;
      }
      localStorage.setItem('chat_user', name);
      initApp(name);
    }

    function initApp(name) {
      currentUser = name;
      document.getElementById('welcomeUser'].innerText = '@' + name;
      
      // Загружаем сохраненную аватарку, если она есть
      const savedAvatar = localStorage.getItem('chat_avatar_' + name);
      if (savedAvatar) {
        document.getElementById('userAvatar').src = savedAvatar;
      }

      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('mainNav').classList.add('active');
      showScreen('chatsScreen', document.querySelector('.nav-btn'));
    }

    function logout() {
      localStorage.removeItem('chat_user');
      location.reload();
    }

    function showScreen(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    // Функция выбора и сохранения аватарки из галереи
    function changeAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        document.getElementById('userAvatar').src = base64Image;
        // Сохраняем индивидуально для каждого пользователя в память браузера
        localStorage.setItem('chat_avatar_' + currentUser, base64Image);
      };
      reader.readAsDataURL(file);
    }

    function openChat() {
      const target = document.getElementById('targetUser').value.trim();
      if (!target) {
        alert('Введите ник собеседника!');
        return;
      }
      if (target === currentUser) {
        alert('Нельзя писать самому себе!');
        return;
      }
      activeChatUser = target;
      document.getElementById('chatWithTitle'].innerText = '@' + target;
      document.getElementById('messagesList').innerHTML = 'Чат открыт. Напишите первое сообщение!';
    }

    function sendMessage() {
      const text = document.getElementById('messageInput').value.trim();
      if (!activeChatUser) {
        alert('Сначала выберите собеседника сверху!');
        return;
      }
      if (!text) return;

      const messagesDiv = document.getElementById('messagesList');
      messagesDiv.innerHTML += `<div><b>@${currentUser}:</b> ${text}</div>`;
      document.getElementById('messageInput'].value = '';
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
