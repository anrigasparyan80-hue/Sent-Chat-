
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sent Chat</title>
  <!-- Подключаем библиотеку Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    
    /* Шапка */
    .header { background: #3ecf8e; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Контентные экраны */
    .screen { display: none; flex: 1; padding: 15px; overflow-y: auto; }
    .screen.active { display: block; }
    
    /* Карточки и элементы */
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:active { opacity: 0.8; }
    
    /* Списки и результаты */
    .user-card { background: #eef9f5; padding: 12px; margin-top: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .user-card button { width: auto; padding: 6px 14px; margin: 0; font-size: 13px; }
    .friend-item { background: white; padding: 12px; border-radius: 8px; margin-top: 8px; border: 1px solid #eee; display: flex; align-items: center; }

    /* Нижняя навигация */
    .nav-bar { display: flex; background: white; border-top: 1px solid #eee; }
    .nav-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #666; font-size: 14px; font-weight: normal; border-radius: 0; }
    .nav-btn.active { color: #3ecf8e; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">Sent Chat</div>

  <!-- ЭКРАН 1: Чаты -->
  <div id="chatsScreen" class="screen active">
    <div class="card">
      <h3>Сообщения 💬</h3>
      <p style="color: #888;">Выберите друга из списка, чтобы начать чат.</p>
    </div>
  </div>

  <!-- ЭКРАН 2: Поиск и Добавление друзей -->
  <div id="searchScreen" class="screen">
    <div class="card">
      <h3>Поиск пользователей 🔍</h3>
      <input type="text" id="usernameInput" placeholder="Введите логин пользователя...">
      <button onclick="searchFriend()">Найти</button>
      <div id="results"></div>
    </div>

    <div class="card">
      <h3>Ваши друзья 👥</h3>
      <div id="friendsList">Загрузка списка...</div>
    </div>
  </div>

  <!-- ЭКРАН 3: Профиль -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <h3>Мой профиль 👤</h3>
      <p>Ваш логин: <b id="myUsernameDisplay">@me</b></p>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="showScreen('chatsScreen', this)">Чаты</button>
    <button class="nav-btn" onclick="showScreen('searchScreen', this)">Поиск</button>
    <button class="nav-btn" onclick="showScreen('profileScreen', this)">Профиль</button>
  </div>

  <script>
    // 1. ПОДКЛЮЧЕНИЕ К SUPABASE
    const SUPABASE_URL = 'https://oqfclosbphhdxhhkzzbm.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_HpqKBPwVpp2FMU2J9LI17g_dgaQBRvr';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUsername = localStorage.getItem('myUsername') || 'me';
    document.getElementById('myUsernameDisplay').innerText = '@' + currentUsername;

    // Переключение экранов
    function showScreen(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(screenId).classList.add('active');
      btn.classList.add('active');

      if (screenId === 'searchScreen') {
        loadFriends();
      }
    }

    // 2. ПОИСК ДРУЗЕЙ В SUPABASE
    async function searchFriend() {
      const query = document.getElementById('usernameInput').value.trim();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = 'Ищем...';

      if (!query) {
        resultsDiv.innerHTML = 'Введите имя для поиска!';
        return;
      }

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .ilike('username', `%${query}%`);

      if (error || !data || data.length === 0) {
        resultsDiv.innerHTML = '<p style="color:#888;">Пользователь не найден ❌</p>';
        return;
      }

      resultsDiv.innerHTML = '';
      data.forEach(user => {
        if (user.username !== currentUsername) {
          resultsDiv.innerHTML += `
            <div class="user-card">
              <span><b>@${user.username}</b></span>
              <button onclick="addFriend('${user.username}')">Добавить</button>
            </div>
          `;
        }
      });
    }

    // 3. ДОБАВЛЕНИЕ В ДРУЗЬЯ
    async function addFriend(friendUsername) {
      const { error } = await supabaseClient
        .from('friends')
        .insert([
          { user_from: currentUsername, user_to: friendUsername, status: 'accepted' }
        ]);

      if (error) {
        alert('Ошибка при добавлении: ' + error.message);
      } else {
        alert(`Пользователь @${friendUsername} добавлен в друзья!`);
        loadFriends();
      }
    }

    // 4. ЗАГРУЗКА СПИСКА ДРУЗЕЙ
    async function loadFriends() {
      const friendsListDiv = document.getElementById('friendsList');

      const { data, error } = await supabaseClient
        .from('friends')
        .select('*')
        .or(`user_from.eq.${currentUsername},user_to.eq.${currentUsername}`);

      if (error || !data || data.length === 0) {
        friendsListDiv.innerHTML = '<p style="color:#888;">У вас пока нет друзей</p>';
        return;
      }

      friendsListDiv.innerHTML = '';
      data.forEach(rel => {
        const friendName = rel.user_from === currentUsername ? rel.user_to : rel.user_from;
        friendsListDiv.innerHTML += `
          <div class="friend-item">
            🟢 &nbsp; <b>@${friendName}</b>
          </div>
        `;
      });
    }

    loadFriends();
  </script>
</body>
</html>
