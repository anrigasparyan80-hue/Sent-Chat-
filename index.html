<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sent Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #3ecf8e; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .header select { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px; border-radius: 6px; cursor: pointer; }
    .screen { display: none; flex: 1; padding: 15px; overflow-y: auto; }
    .screen.active { display: flex; flex-direction: column; }
    .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; text-align: left; }
    
    .phone-row { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
    .phone-row select { width: 110px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; cursor: pointer; }
    .phone-row input { flex: 1; margin: 0; }

    button { width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
    button.secondary { background: #666; }
    button.premium-btn { background: linear-gradient(135deg, #f39c12, #f1c40f); color: #fff; }
    
    .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto 10px auto; cursor: pointer; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #3ecf8e; background: #eee; }
    .avatar-edit-overlay { position: absolute; bottom: 0; right: 0; background: #3ecf8e; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid white; }
    
    .nav-bar { display: none; background: white; border-top: 1px solid #eee; }
    .nav-bar.active { display: flex; }
    .nav-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #666; font-size: 14px; cursor: pointer; }
    .nav-btn.active { color: #3ecf8e; font-weight: bold; }

    .chat-item { display: flex; align-items: center; padding: 12px; background: #fafafa; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; text-align: left; justify-content: space-between; }
    .chat-item:hover { background: #f0f4f2; }
    .chat-item-name { font-weight: bold; font-size: 16px; color: #333; }
    
    #chatRoomScreen { display: none; flex-direction: column; height: 100%; }
    #chatRoomScreen.active { display: flex; }
    .chat-header-bar { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
    .back-btn { width: auto; padding: 8px 12px; margin: 0; background: #666; font-size: 13px; }
    .messages-container { flex: 1; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px; background: #fafafa; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    
    .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
    .msg-incoming { background: #fff; border: 1px solid #eee; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg-outgoing { background: #3ecf8e; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-info { font-size: 11px; display: flex; justify-content: flex-end; gap: 4px; margin-top: 4px; opacity: 0.8; }
    
    .owner-badge { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; display: inline-block; vertical-align: middle; }
    .owner-text { color: #c0392b !important; font-weight: bold; }

    .pro-badge { background: #f1c40f; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; display: inline-block; vertical-align: middle; }
    .pro-text { color: #d4ac0d !important; font-weight: bold; }

    .fab-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        background: #10b981;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        cursor: pointer;
        border: none;
        z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- СПЛЕШ-СКРИН -->
  <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
      <img src="GigaChat.jpg" alt="Sent Chat Logo" style="width: 200px; max-width: 80%; height: auto; margin-bottom: 25px;">
      <div style="width: 35px; height: 35px; border: 3px solid rgba(0, 50, 150, 0.1); border-top: 3px solid #1a365d; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <div class="header">
    <span id="appTitle">Sent Chat</span>
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="ru">RU</option>
      <option value="en">EN</option>
    </select>
  </div>

  <!-- ВХОД -->
  <div id="authScreen" class="screen active">
    <div class="card">
      <h3 data-i18n="authTitle">Вход в чат 🔑</h3>
      <input type="text" id="loginInput" placeholder="Введите ваш никнейм">
      
      <div class="phone-row">
        <select id="countryCode">
          <option value="+995">🇬🇪 +995</option>
          <option value="+7">🇷🇺/🇰🇿 +7</option>
          <option value="+380">🇺🇦 +380</option>
          <option value="+375">🇧🇾 +375</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+49">🇩🇪 +49</option>
        </select>
        <input type="tel" id="phoneInput" placeholder="Номер телефона">
      </div>

      <button onclick="loginUser()" data-i18n="authBtn">Войти в приложение</button>
    </div>
  </div>

  <!-- СПИСОК ЧАТОВ -->
  <div id="chatsScreen" class="screen">
    <div class="card" style="text-align: left; margin-bottom: 10px;">
      <h3 data-i18n="chatsHeader" style="margin-top:0;">Чаты 💬</h3>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="targetUser" placeholder="Ник нового собеседника..." style="margin:0;">
        <button onclick="startNewChat()" style="margin:0; width: 130px;" data-i18n="startChatBtn">Начать</button>
      </div>
    </div>
    
    <div class="card" style="text-align: left; flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 0;">
      <h4 style="margin-top:0; color: #666;" data-i18n="recentChats">Недавние диалоги</h4>
      <div id="chatsListContainer" style="overflow-y: auto; flex: 1;" data-i18n="noChats">Список чатов пуст</div>
    </div>
  </div>

  <!-- КОМНАТА ЧАТА -->
  <div id="chatRoomScreen" class="screen">
    <div class="chat-header-bar">
      <button class="back-btn" onclick="closeChat()" data-i18n="backBtn">⬅ Назад</button>
      <h3 style="margin:0;"><span id="chatWithTitle" style="color: #3ecf8e;">никто</span></h3>
    </div>
    
    <div id="messagesList" class="messages-container" data-i18n="noMessages">Сообщений пока нет</div>
    
    <div style="display: flex; gap: 8px;">
      <input type="text" id="messageInput" placeholder="Введите сообщение..." style="margin:0;">
      <button onclick="sendMessage()" style="margin:0; width: 110px;" data-i18n="sendBtn">Отправить</button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <h3 data-i18n="profileHeader">Профиль 👤</h3>
      
      <div class="avatar-container" onclick="document.getElementById('avatarFile').click()">
        <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
        <div class="avatar-edit-overlay">📷</div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display: none;" onchange="changeAvatar(event)">

      <p style="margin-top: 15px;"><span data-i18n="yourNick">Ваш ник</span>: <b id="welcomeUser">@...</b></p>
      <p><span data-i18n="yourPhone">Телефон</span>: <b id="welcomePhone">+...</b></p>
      
      <!-- Секция статуса -->
      <div id="subscriptionCard" style="background: #fffdf0; border: 1px dashed #f1c40f; padding: 12px; border-radius: 8px; margin: 15px 0;">
        <p style="margin: 0 0 8px 0; font-size: 14px;" id="subStatusText">Статус: Обычный</p>
        <button class="premium-btn" onclick="buySubscription()" data-i18n="buySubBtn">👑 Купить PRO Подписку</button>
      </div>

      <button onclick="logout()" class="secondary" data-i18n="logoutBtn">Выйти из аккаунта</button>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <div class="nav-bar" id="mainNav">
    <button class="nav-btn active" id="navChatsBtn" onclick="switchMainTab('chatsScreen', this)" data-i18n="navChats">Чаты</button>
    <button class="nav-btn" id="navProfileBtn" onclick="switchMainTab('profileScreen', this)" data-i18n="navProfile">Профиль</button>
  </div>

  <button id="fab-menu-btn" class="fab-btn">+</button>

  <script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
            }
        }, 1800);
    });

    const SUPABASE_URL = 'https://avthoshhrwqsyqibxksl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dGhvc2hocndxc3lxaWJ4a3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTgwNjUsImV4cCI6MjEwMDk5NDA2NX0.S6cCH-Y7CfmY_WQPqwkYOMq1BOFxeQlwWWyrC398Oc8';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const OWNER_USERNAME = 'Admin';

    const translations = {
      ru: {
        authTitle: "Вход в чат 🔑",
        authPlaceholder: "Введите ваш никнейм",
        phonePlaceholder: "Номер телефона",
        authBtn: "Войти в приложение",
        chatsHeader: "Чаты 💬",
        startChatBtn: "Начать чат",
        recentChats: "Недавние диалоги",
        noChats: "Список чатов пуст. Начните новый диалог выше!",
        noMessages: "Сообщений пока нет",
        msgPlaceholder: "Введите сообщение...",
        sendBtn: "Отправить",
        backBtn: "⬅ Назад",
        profileHeader: "Профиль 👤",
        yourNick: "Ваш ник",
        yourPhone: "Телефон",
        logoutBtn: "Сменить аккаунт",
        navChats: "Чаты",
        navProfile: "Профиль",
        buySubBtn: "👑 Купить PRO Подписку",
        subOwner: "Статус: 🛡️ Владелец приложения (Создатель)",
        subActive: "Статус: 👑 PRO Подписка активна!",
        subNormal: "Статус: Базовый (Без подписки)",
        subSuccess: "Поздравляем! Вы успешно активировали PRO-подписку!",
        alertNoName: "Введите никнейм!",
        alertNoPhone: "Введите номер телефона!",
        alertSelf: "Нельзя писать самому себе!",
        alertNoTarget: "Введите ник собеседника!",
        alertUserNotFound: "Такого пользователя не существует в базе!"
      },
      en: {
        authTitle: "Chat Login 🔑",
        authPlaceholder: "Enter your nickname",
        phonePlaceholder: "Phone number",
        authBtn: "Sign In",
        chatsHeader: "Chats 💬",
        startChatBtn: "Start Chat",
        recentChats: "Recent Chats",
        noChats: "No chats yet. Start a new chat above!",
        noMessages: "No messages yet",
        msgPlaceholder: "Type a message...",
        sendBtn: "Send",
        backBtn: "⬅ Back",
        profileHeader: "Profile 👤",
        yourNick: "Your nickname",
        yourPhone: "Phone",
        logoutBtn: "Switch Account",
        navChats: "Chats",
        navProfile: "Profile",
        buySubBtn: "👑 Buy PRO Subscription",
        subOwner: "Status: 🛡️ App Owner (Creator)",
        subActive: "Status: 👑 PRO Subscription Active!",
        subNormal: "Status: Basic",
        subSuccess: "Congratulations! You activated PRO status!",
        alertNoName: "Enter a nickname!",
        alertNoPhone: "Enter a phone number!",
        alertSelf: "You cannot message yourself!",
        alertNoTarget: "Enter recipient's nickname!",
        alertUserNotFound: "User does not exist in database!"
      }
    };

    let currentLang = localStorage.getItem('chat_lang') || 'ru';
    document.getElementById('langSelect').value = currentLang;

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('chat_lang', lang);
      updateTexts();
    }

    function updateTexts() {
      const t = translations[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] && el.id !== 'messagesList' && el.id !== 'chatsListContainer') {
          el.innerText = t[key];
        }
      });
      document.getElementById('loginInput').placeholder = t.authPlaceholder;
      document.getElementById('phoneInput').placeholder = t.phonePlaceholder;
      document.getElementById('targetUser').placeholder = "Ник собеседника...";
      document.getElementById('messageInput').placeholder = t.msgPlaceholder;
      updateProfileUI();
    }

    let currentUser = localStorage.getItem('chat_user') || '';
    let currentPhone = localStorage.getItem('chat_phone') || '';
    let activeChatUser = '';
    let messageInterval = null;

    if (currentUser) {
      initApp(currentUser, currentPhone);
    }

    function isOwner(username) {
      return username.toLowerCase() === OWNER_USERNAME.toLowerCase();
    }

    async function loginUser() {
      const name = document.getElementById('loginInput').value.trim();
      const code = document.getElementById('countryCode').value;
      const rawPhone = document.getElementById('phoneInput').value.trim();
      const t = translations[currentLang];

      if (!name) { alert(t.alertNoName); return; }
      if (!rawPhone) { alert(t.alertNoPhone); return; }

      const fullPhone = code + ' ' + rawPhone;

      const { error } = await supabaseClient
        .from('profiles')
        .upsert({ username: name, phone: fullPhone }, { onConflict: 'username' });

      if (error) {
        alert("Ошибка входа: " + error.message);
        return;
      }

      localStorage.setItem('chat_user', name);
      localStorage.setItem('chat_phone', fullPhone);
      initApp(name, fullPhone);
    }

    function initApp(name, phone) {
      currentUser = name;
      currentPhone = phone;
      document.getElementById('welcomeUser').innerText = '@' + name;
      document.getElementById('welcomePhone').innerText = phone;
      
      const savedAvatar = localStorage.getItem('chat_avatar_' + name);
      if (savedAvatar) {
        document.getElementById('userAvatar').src = savedAvatar;
      }

      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('mainNav').classList.add('active');
      switchMainTab('chatsScreen', document.getElementById('navChatsBtn'));
      loadUserChats();
      updateTexts();
    }

    function logout() {
      localStorage.removeItem('chat_user');
      localStorage.removeItem('chat_phone');
      location.reload();
    }

    function switchMainTab(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => {
        if(s.id !== 'chatRoomScreen') s.classList.remove('active');
      });
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (btn) btn.classList.add('active');
      if (screenId === 'chatsScreen') {
        loadUserChats();
      }
    }

    function changeAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        document.getElementById('userAvatar').src = base64Image;
        localStorage.setItem('chat_avatar_' + currentUser, base64Image);
      };
      reader.readAsDataURL(file);
    }

    function buySubscription() {
      localStorage.setItem('chat_pro_' + currentUser, 'true');
      alert(translations[currentLang].subSuccess);
      updateProfileUI();
    }

    function isUserPro(username) {
      return localStorage.getItem('chat_pro_' + username) === 'true';
    }

    function updateProfileUI() {
      const t = translations[currentLang];
      const subTextEl = document.getElementById('subStatusText');
      const buyBtnEl = document.querySelector('.premium-btn');
      const subCard = document.getElementById('subscriptionCard');
      
      if (isOwner(currentUser)) {
        subTextEl.innerText = t.subOwner;
        subTextEl.style.color = "#c0392b";
        subTextEl.style.fontWeight = "bold";
        subCard.style.background = "#fdedec";
        subCard.style.borderColor = "#e74c3c";
        if(buyBtnEl) buyBtnEl.style.display = 'none';
      } else if (isUserPro(currentUser)) {
        subTextEl.innerText = t.subActive;
        subTextEl.style.color = "#d4ac0d";
        subTextEl.style.fontWeight = "bold";
        if(buyBtnEl) buyBtnEl.style.display = 'none';
      } else {
        subTextEl.innerText = t.subNormal;
        subTextEl.style.color = "#333";
        subTextEl.style.fontWeight = "normal";
        if(buyBtnEl) buyBtnEl.style.display = 'block';
      }
    }

    async function startNewChat() {
      const target = document.getElementById('targetUser').value.trim();
      const t = translations[currentLang];
      if (!target) { alert(t.alertNoTarget); return; }
      if (target === currentUser) { alert(t.alertSelf); return; }

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('username')
        .eq('username', target)
        .single();

      if (error || !data) {
        alert(t.alertUserNotFound);
        return;
      }

      document.getElementById('targetUser').value = '';
      openChatRoom(target);
    }

    async function loadUserChats() {
      const container = document.getElementById('chatsListContainer');
      const t = translations[currentLang];

      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`sender.eq.${currentUser},recipient.eq.${currentUser}`)
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = `<div style="color: #888; text-align: center; padding: 20px;">${t.noChats}</div>`;
        return;
      }

      const interlocutors = new Set();
      data.forEach(msg => {
        if (msg.sender === currentUser) interlocutors.add(msg.recipient);
        if (msg.recipient === currentUser) interlocutors.add(msg.sender);
      });

      if (interlocutors.size === 0) {
        container.innerHTML = `<div style="color: #888; text-align: center; padding: 20px;">${t.noChats}</div>`;
        return;
      }

      let html = '';
      interlocutors.forEach(username => {
        let nameClass = '';
        let badge = '';

        if (isOwner(username)) {
          nameClass = 'owner-text';
          badge = '<span class="owner-badge">ВЛАДЕЛЕЦ</span>';
        } else if (isUserPro(username)) {
          nameClass = 'pro-text';
          badge = '<span class="pro-badge">PRO</span>';
        }
        
        html += `
          <div class="chat-item" onclick="openChatRoom('${username}')">
            <div>
              <div class="chat-item-name ${nameClass}">@${username} ${badge}</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function openChatRoom(username) {
      activeChatUser = username;
      let badge = '';
      if (isOwner(username)) badge = ' <span class="owner-badge">ВЛАДЕЛЕЦ</span>';
      else if (isUserPro(username)) badge = ' <span class="pro-badge">PRO</span>';

      document.getElementById('chatWithTitle').innerHTML = '@' + username + badge;
      
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('mainNav').classList.remove('active');
      document.getElementById('chatRoomScreen').classList.add('active');

      markMessagesAsRead();
      loadMessages();
      if (messageInterval) clearInterval(messageInterval);
      messageInterval = setInterval(loadMessages, 3000);
    }

    function closeChat() {
      if (messageInterval) clearInterval(messageInterval);
      document.getElementById('chatRoomScreen').classList.remove('active');
      document.getElementById('chatsScreen').classList.add('active');
      document.getElementById('mainNav').classList.add('active');
      loadUserChats();
    }

    async function sendMessage() {
      const text = document.getElementById('messageInput').value.trim();
      if (!activeChatUser || !text) return;

      const { error } = await supabaseClient
        .from('messages')
        .insert([{ sender: currentUser, recipient: activeChatUser, text: text, read: false }]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
        return;
      }

      document.getElementById('messageInput').value = '';
      loadMessages();
    }

    async function markMessagesAsRead() {
      await supabaseClient
        .from('messages')
        .update({ read: true })
        .eq('sender', activeChatUser)
        .eq('recipient', currentUser);
    }

    async function loadMessages() {
      if (!activeChatUser) return;

      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`and(sender.eq.${currentUser},recipient.eq.${activeChatUser}),and(sender.eq.${activeChatUser},recipient.eq.${currentUser})`)
        .order('created_at', { ascending: true });

      const messagesDiv = document.getElementById('messagesList');
      if (error || !data || data.length === 0) {
        messagesDiv.innerHTML = `<div style="text-align: center; color: #888; margin-top: auto; margin-bottom: auto;">${translations[currentLang].noMessages}</div>`;
        return;
      }

      markMessagesAsRead();

      let html = '';
      data.forEach(msg => {
        const isMy = msg.sender === currentUser;
        const bubbleClass = isMy ? 'msg-outgoing' : 'msg-incoming';
        
        let timeStr = "";
        if (msg.created_at) {
          const date = new Date(msg.created_at);
          timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        let infoHtml = '';
        if (isMy) {
          const checkmarks = msg.read ? '✓✓' : '✓';
          infoHtml = `<div class="msg-info"><span>${timeStr}</span> <span style="font-weight: bold; color: ${msg.read ? '#fff' : 'rgba(255,255,255,0.7)'};">${checkmarks}</span></div>`;
        } else {
          infoHtml = `<div class="msg-info"><span>${timeStr}</span></div>`;
        }

        html += `
          <div class="msg-bubble ${bubbleClass}">
            <div><b>@${msg.sender}:</b> ${msg.text}</div>
            ${infoHtml}
          </div>
        `;
      });
      messagesDiv.innerHTML = html;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
